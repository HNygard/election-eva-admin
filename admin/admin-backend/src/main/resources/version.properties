# ADDED. no.evote.util.CommitIdProducer reads /version.properties at startup and
# throws "Could not find version properties file /version.properties" without it,
# which takes down ReportTemplateUploader and every startup singleton behind it.
#
# This is not invented configuration. admin-backend/pom.xml runs
# git-commit-id-plugin's revision goal and marks src/main/resources as filtered,
# so the release had a file here using exactly this substitution. It was stripped
# for publication along with the other build-time artefacts.
#
# See docs/not-fixed-yet/NF-018.
commitId=${git.commit.id}
