# ADDED. no.evote.util.VersionResourceStreamProvider loads /version.properties and
# throws "Could not find version properties file /version.properties" without it,
# taking down CommitIdProducer and every startup singleton behind it.
#
# Not invented: admin-backend/pom.xml runs git-commit-id-plugin's revision goal
# and marks src/main/resources as filtered, so the release had this file and used
# exactly these substitutions. It was stripped for publication.
#
# The "version" key matters beyond bookkeeping: LifecycleFilter compares
# frontend-version against backend-version and disables the whole application
# when they differ. Both modules are filtered from the same build, so both agree.
#
# See docs/not-fixed-yet/NF-018.
version=${project.version}
branch=${git.branch}
commitId=${git.commit.id}
