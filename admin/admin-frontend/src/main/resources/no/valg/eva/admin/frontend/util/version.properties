# ADDED. no.valg.eva.admin.frontend.util.VersionProperties loads this with
# getResourceAsStream("version.properties"), which resolves relative to its own
# package -- hence this path rather than the classpath root the backend uses.
#
# Supplies frontend-version for LifecycleFilter's frontend/backend version check.
# Same substitutions as the backend's copy, filtered from the same build, so the
# two versions match and the application is not disabled.
#
# See docs/not-fixed-yet/NF-018.
version=${project.version}
branch=${git.branch}
commitId=${git.commit.id}
