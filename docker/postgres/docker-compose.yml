# PostgreSQL for EVA Admin, on the coordinates the release itself expects.
#
# The root pom defaults to testDatabaseHost=localhost, testDatabasePort=15432,
# testDatabaseName=evote, and admin/admin-backend/src/test/resources/META-INF/
# persistence.xml connects as admin/admin with PostgreSQL9Dialect. Matching those
# exactly means the release's own configuration works unmodified.
#
#   docker compose -f docker/postgres/docker-compose.yml up -d
#
# Adminer is on http://localhost:15433/ (System: PostgreSQL, Server: eva-postgres,
# Database: evote, Username: admin, Password: admin).

services:
  eva-postgres:
    image: postgres:11
    container_name: eva-admin-postgres
    environment:
      POSTGRES_DB: evote
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "15432:5432"
    volumes:
      # Everything in initdb/ runs in filename order, but only on a database
      # that is still empty. To re-apply after changing the schema:
      #   docker compose -f docker/postgres/docker-compose.yml down -v
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - eva-postgres-data:/var/lib/postgresql/data

  eva-adminer:
    image: adminer
    container_name: eva-admin-adminer
    ports:
      - "15433:8080"
    depends_on:
      - eva-postgres

volumes:
  eva-postgres-data:
